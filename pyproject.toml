# pyproject.toml
[project]
name = "riah-code"
version = "0.1.0"
description = "LLM training platform from scratch with chat interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "flask>=3.1",
    "flask-sock>=0.5",
    "gunicorn>=22.0",
    
    # Configuration
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    
    # Database (SQLite only, custom migrations)
    
    # Redis
    "redis>=5.0",
    
    # ML / PyTorch
    "torch>=2.3",
    "torchvision>=0.18",
    "torchaudio>=2.3",
    "tokenizers>=0.19",
    "transformers>=4.40",
    "accelerate>=0.30",
    "datasets>=2.19",
    "safetensors>=0.4",
    
    # Data processing
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "zstandard>=0.23",
    
    # Scraping (core)
    "requests>=2.31",
    "aiohttp>=3.9",
    "lxml>=5.0",
    # "mwparserfromhell>=0.6",  # optional - for Wikipedia markup parsing
    "ftfy>=6.2",
    # "fasttext>=0.9.2",       # optional - for language detection
    # "datasketch>=1.6",       # optional - for MinHash deduplication
    
    # Monitoring (optional - install when needed)
    # "prometheus-client>=0.19",
    # "tensorboard>=2.16",
    
    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.66",
    
    # Auth
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "hypothesis>=6.99",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "hypothesis>=6.99",
]
gpu = [
    "torch>=2.3+cu121",
    "flash-attn>=2.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T10", "ICN", "PIE", "PT", "Q", "RSE", "SIM", "TID", "TRY", "ARG", "PTH", "ERA", "PD", "PL", "TRY"]
ignore = ["E501", "ARG001", "ARG002"]
per-file-ignores = { "tests/*" = ["S101", "S106", "PT011", "PT012", "PT013", "PT014", "PT015"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
enable_error_code = ["ignore-without-code"]

[[tool.mypy.overrides]]
module = ["tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --strict-config --tb=short -ra"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (requires DB, services)",
    "e2e: End-to-end tests (requires full stack)",
    "slow: Tests taking > 10s",
    "gpu: Tests requiring GPU",
    "ml: ML-specific tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"